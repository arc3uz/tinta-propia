name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publicar (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            args: --bundles appimage,deb,rpm
          - os: windows-latest
            artifact: windows
            args: --bundles nsis,msi
          - os: macos-latest
            artifact: macos
            args: --bundles dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Objetivos macOS
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Construir y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tinta Propia ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Tinta Propia ${{ github.ref_name }}

            Aplicación de escritorio para escribir manuscritos con tu propia letra.
            Todo funciona de forma local, sin cuentas ni conexión a internet.

            ### Novedades de esta versión

            - Fórmulas LaTeX en línea y en bloque, con MathJax incluido.
            - Mezcla de hasta cuatro fuentes manuscritas por sección o por línea.
            - Hoja horizontal dividida en 3 columnas, con PDF e impresión horizontal.
            - Pantalla de inicio con biblioteca de proyectos en árbol, carpetas y etiquetas.
            - Tamaños de letra desde 12 px y pantalla completa con F11.

            ### Instaladores

            - **Linux:** AppImage, `.deb` y `.rpm`.
            - **Windows 10/11:** instalador NSIS (`.exe`) y MSI (`.msi`).
            - **macOS:** DMG universal para Apple Silicon e Intel.

            Los instaladores de Windows incluyen WebView2 en modo offline.
            No están firmados digitalmente, así que SmartScreen puede pedir
            confirmación.

            El DMG de macOS usa una firma ad-hoc y todavía no está notarizado.
            Para abrirlo, usa clic derecho → **Abrir**, o elimina la cuarentena con:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/Tinta Propia.app"
            ```

            ### Notas

            - La primera vez que se abre un documento con diagramas Mermaid,
              se dibujan en segundo plano.
            - El autoguardado vive en la carpeta de datos de la aplicación.
            - Los proyectos se guardan como archivos `.papernotes`.
