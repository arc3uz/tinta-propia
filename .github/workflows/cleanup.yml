name: Limpieza de artefactos

on:
  schedule:
    # Todos los días a las 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Borrar artefactos con más de N días"
        required: false
        default: "2"
      dry_run:
        description: "Solo listar, sin borrar"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Borrar artefactos antiguos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Limpiar artefactos de Actions
        uses: actions/github-script@v7
        env:
          DAYS: ${{ github.event.inputs.days || '2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          script: |
            const days = Number(process.env.DAYS);
            const dryRun = String(process.env.DRY_RUN) === "true";

            if (!Number.isFinite(days) || days < 1) {
              throw new Error("El número de días debe ser un entero mayor o igual a 1.");
            }

            const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const candidates = artifacts.filter((artifact) => {
              if (artifact.expired) return false;
              return new Date(artifact.created_at).getTime() < cutoff;
            });

            let deleted = 0;
            let bytes = 0;

            for (const artifact of candidates) {
              const size = artifact.size_in_bytes || 0;
              if (dryRun) {
                core.info(`[dry-run] Borraría: ${artifact.name} (${size} bytes)`);
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                bytes += size;
                core.info(`Borrado: ${artifact.name} (${artifact.id})`);
              } catch (error) {
                core.warning(`No se pudo borrar ${artifact.name}: ${error.message}`);
              }
            }

            const mb = (bytes / 1024 / 1024).toFixed(1);
            const resumen = dryRun
              ? `Se borrarían **${candidates.length}** artefactos con más de **${days}** días.`
              : `Borrados **${deleted}** artefactos con más de **${days}** días (${mb} MB).`;

            core.info(resumen);
            await core.summary
              .addHeading("Limpieza de artefactos")
              .addRaw(resumen)
              .write();
