[package]
name = "tinta-propia"
version = "0.5.0"
description = "Editor local de manuscritos Tinta Propia"
authors = ["Tinta Propia contributors"]
license = "MIT"
repository = "https://github.com/arc3uz/tinta-propia"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tinta_propia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
lopdf = "0.47"
